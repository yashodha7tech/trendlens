<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrendLens</title>
    <script>
      // TrendLens pages live under #/ (for example /#/explore/igp). Send a path such as
      // /explore/igp to the matching page; unknown paths land on the app's not-found page.
      location.replace('/#' + location.pathname + location.search)
    </script>
  </head>
  <body>
    <p><a href="/">Open TrendLens</a></p>
  </body>
</html>
